name: Site checks

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check HTML links, forms, and event data
        run: python .github/scripts/check_site.py
      - name: Check JavaScript syntax
        run: node .github/scripts/check_javascript.mjs
      - name: Check pricing and Amazon identity matching (offline)
        run: |
          node scripts/update-dead-games.cjs --check
          node scripts/test-dead-games.cjs
          node scripts/test-floor-pricing.cjs
          node scripts/test-amazon-matching.cjs
          node scripts/test-skylander-sales.cjs
          node scripts/test-history-audit.cjs
          node scripts/test-trade-serials.cjs
          node scripts/test-gamestop-stock.cjs
          node scripts/test-gamestop-helper.cjs
      - name: Install PHP test runtime
        run: sudo apt-get update -qq && sudo apt-get install -y php-cli php-curl php-mbstring php-sqlite3 php-xml
      - name: Check PHP syntax
        run: find shop trade-in scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check Amazon catalog and offer boundaries (offline)
        run: php scripts/test-amazon-api.php
      - name: Check Amazon throttle recovery (offline)
        run: php scripts/test-amazon-rate-limit.php
      - name: Check GameStop product links (offline)
        run: php scripts/test-gamestop-links.php
      - name: Check GameStop stock signals (offline)
        run: php scripts/test-gamestop-stock.php
      - name: Check checkout recovery and inventory mappings (offline)
        run: php scripts/test-shop-checkout.php
      - name: Check preview routes and staff access (offline)
        run: python scripts/test-shop-http.py
